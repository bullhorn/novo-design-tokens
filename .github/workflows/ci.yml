name: CI
on:
  pull_request:
  push:
    # Feature branches get fast feedback here; release branches run tests in release.yml.
    branches-ignore:
      - main
      - next
      - beta
      - alpha
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # matches package.json engines (Style Dictionary v5 / node:test)
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
